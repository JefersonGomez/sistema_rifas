# Sitio de Rifas Ivannia en el Nginx que ya tiene el VPS (lo comparte con otros proyectos).
# Instalar:
#   sudo cp despliegue/nginx-rifas.conf /etc/nginx/sites-available/rifas
#   sudo ln -s /etc/nginx/sites-available/rifas /etc/nginx/sites-enabled/rifas
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rifasivannia.duckdns.org     (agrega el HTTPS y la redirección)
# Cambiar el subdominio si se registró otro en DuckDNS, y el puerto si PORT en api/.env no es 3100.
server {
    listen 80;
    listen [::]:80;
    server_name rifasivannia.duckdns.org;

    # Fotos de hasta 5 MB más un margen.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
